name: 编译检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android 编译
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 初始化 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          # 这一版命令行工具兼容本项目的 JDK 17。
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: 安装 Android SDK 组件
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: 检查使用说明一致
        run: cmp docs/使用说明.txt package/使用说明.txt
      - name: 编译模块
        run: bash ./gradlew --no-daemon assembleRelease
